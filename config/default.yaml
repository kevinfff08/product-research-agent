research:
  max_paths: 5
  max_parallel_paths: 3
  api_concurrency: 5
  llm_analysis_concurrency: 3
  max_search_results_per_query: 10
  max_web_queries_per_path: 10
  max_code_queries_per_path: 8
  max_academic_queries_per_path: 5
  max_arxiv_queries_per_path: 4
  max_github_results_per_query: 10
  max_papers_per_path: 15
  max_repos_per_path: 10
  max_blog_sources: 10

weights:
  industry: 0.60
  academic: 0.25
  community: 0.15

api:
  tavily:
    search_depth: "advanced"
    max_results: 10
  semantic_scholar:
    rate_limit_rps: 1.0
    rate_limit_rps_keyed: 10.0
  github:
    rate_limit_rps: 0.5
    rate_limit_rps_keyed: 5.0
  arxiv:
    rate_limit_rps: 0.3
    max_results: 20
  web_scraper:
    timeout: 30
    max_content_length: 50000

llm:
  default_max_tokens: 8192
  decompose_temperature: 0.5
  analysis_temperature: 0.2
  synthesis_temperature: 0.3

cache:
  ttl_hours: 24
